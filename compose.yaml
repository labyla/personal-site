services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
  harness:
    image: python:3.13-alpine
    profiles: [checks]
    working_dir: /app
    volumes:
      - .:/app:ro
volumes:
  node_modules:
  next_cache:
